<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokativ — Hors ligne</title>
    <meta name="theme-color" content="#1e40af">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #fff;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }

        .logo-wrap {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            overflow: hidden;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        .wifi-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.9;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            color: #1e40af;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 14px 32px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.2);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .tips {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .tips p {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-bottom: 0;
        }

        .tips ul {
            list-style: none;
            margin-top: 10px;
        }

        .tips li {
            font-size: 0.82rem;
            opacity: 0.7;
            padding: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fbbf24;
            display: inline-block;
            margin-right: 4px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/logo/LOGO.jpg" alt="Lokativ" onerror="this.parentElement.innerHTML='<span style=\'font-size:36px;\'>🏠</span>'">
        </div>

        <div class="wifi-icon">📡</div>

        <h1>Vous êtes hors ligne</h1>
        <p>
            Vérifiez votre connexion internet et réessayez.<br>
            Lokativ nécessite une connexion pour fonctionner.
        </p>

        <button class="btn-retry" onclick="retryConnection()">
            <span>↻</span>
            Réessayer
        </button>

        <div class="tips">
            <p>Conseils :</p>
            <ul>
                <li>✓ Vérifiez votre Wi-Fi ou données mobiles</li>
                <li>✓ Désactivez puis réactivez le mode avion</li>
                <li>✓ Redémarrez votre routeur si nécessaire</li>
            </ul>
        </div>
    </div>

    <script>
        function retryConnection() {
            const btn = document.querySelector('.btn-retry');
            btn.innerHTML = '<span style="display:inline-block;animation:spin 0.8s linear infinite">↻</span> Connexion...';
            btn.disabled = true;

            setTimeout(() => {
                window.location.reload();
            }, 800);
        }

        // Retour automatique dès que la connexion revient
        window.addEventListener('online', () => {
            window.location.href = '/';
        });

        // Surveiller la connexion toutes les 5s
        setInterval(() => {
            if (navigator.onLine) {
                fetch('/', { method: 'HEAD', cache: 'no-cache' })
                    .then(() => window.location.href = '/')
                    .catch(() => {});
            }
        }, 5000);
    </script>

    <style>
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</body>
</html>
